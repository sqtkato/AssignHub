<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>アサイン履歴情報変更</title>
</head>
<body>
	<div layout:fragment="content">
			<div class="page-title-area">
				<h2>アサイン履歴情報変更</h2>
			</div>
			<div class="card form-card">
						<form th:action="@{/companies}" th:object="${AssignmentForm}" method="post">

							<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
								<p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
							</div>

							<div class="form-group">
												<label>社員名 <span class="badge-required">必須</span></label>
												<select name="roleId">
													<option value="">未選択</option>
													<option th:each="role : ${}"
													th:value="${role.id}"
													th:text="${role.name}">
													 </option>
												</select>
											</div>
							
							<div class="form-group">
								<label>アサイン先企業名 <span class="badge-required">必須</span></label>
								<input type="text" th:field="*{companyName}" class="form-control"
								th:classappend="${#fields.hasErrors('companyName')} ? 'input-error'"
								placeholder="未選択">
								<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
							</div>
						</div>
						
						<div class="form-group">
							<label>契約開始日 <span class="badge-required">必須</span></label>
							<input type="text" th:field="*{companyName}" class="form-control"
							th:classappend="${#fields.hasErrors('companyName')} ? 'input-error'"
							placeholder="未選択">
							<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
							</div>
						</div>
						<div class="form-group">
							<label>契約終了日 </label>
							<input type="text" th:field="*{companyName}" class="form-control"
							th:classappend="${#fields.hasErrors('companyName')} ? 'input-error'"
							placeholder="未選択">
							<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
						</div>
					</div>
					<div class="form-group">
						<label>契約単価 <span class="badge-required">必須</span></label>
						<input type="text" th:field="*{unitPrice}" class="form-control"
						th:classappend="${#fields.hasErrors('unitPrice')} ? 'input-error'"
						placeholder="例：100,000">
						<div class="error-message" th:if="${#fields.hasErrors('unitPrice')}" th:errors="*{unitPrice}">
					</div>
				</div>
				
				<div class="form-group">
					<label>役割 <span class="badge-required">必須</span></label>
					<select name="roleId">
						<option value="">未選択</option>
						<option th:each="role : ${}"
						th:value="${role.id}"
						th:text="${role.name}">
						 </option>
					</select>
				</div>
				
				
<!--				 				<select name="itemId">
				  <option value="">選択してください</option>
				  <option th:each="item : ${items}"
				          th:value="${item.id}"
				          th:text="${item.name}">
				  </option>
				</select>
	
	
	店舗名 -->

<!--						<label for="departmentId">店舗名</label>-->
<!--						<select class="dropdown form-control">-->
<!--							<option th:value="0"></option>-->
<!--							<option th:each="item : ${mDepartmentMap}" th:value="${item.value}" th:text="${item.key}"></option>-->
<!--						</select>-->
<!--					</div>-->
					
					
							<div class="form-actions">
								<button type="submit" class="btn btn-primary">更新</button>
								<a th:href="@{/companies}" class="btn btn-secondary">戻る</a>
							</div>
						</form>
					</div>
			</div>
</body>
</html>
