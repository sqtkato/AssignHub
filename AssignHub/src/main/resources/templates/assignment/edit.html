<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>アサイン履歴情報変更</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>アサイン履歴情報変更</h2>
		</div>
		<div class="card form-card">
			<form th:action="@{/assignments/__${id}__/edit(id=${assignmentForm.assignmentId})}"
				th:object="${assignmentForm}" method="post">
				<input type="hidden" th:field="*{assignmentId}">
				<input type="hidden" name="fromPage" th:value="${fromPage}" />
				<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
					<p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
				</div>
				<div class="form-group">
					<label>社員名 <span class="badge-required">必須</span></label>
					<select th:field="*{empId}" class="dropdown form-control">
						<option th:value="">未選択</option>
						<option th:each="assignment : ${assignments}" th:value="${assignment.empId}"
							th:text="${assignment.empName}">
						</option>
					</select>
					<div class="error-message" th:if="${#fields.hasErrors('empId')}" th:errors="*{empId}">
					</div>
				</div>
				<div class="form-group">
					<label>企業名 <span class="badge-required">必須</span></label>
					<select th:field="*{companyId}" class="dropdown form-control">
						<option th:value="">未選択</option>
						<option th:each="assignment : ${assignments}" th:value="${assignmenrt.companyId}"
							th:text="${assignment.companyName}">
						</option>
					</select>
					<div class="error-message" th:if="${#fields.hasErrors('companyId')}" th:errors="*{companyId}">
					</div>
				</div>
				<div class="form-group">
					<label>契約開始日 <span class="badge-required">必須</span></label>
					<input type="date" max="9999-12-31" th:field="*{contractStartDate}" class="form-control">
					<div class="error-message" th:if="${#fields.hasErrors('contractStartDate')}"
						th:errors="*{contractStartDate}">
					</div>
				</div>
				<div class="form-group">
					<label>契約終了日</label>
					<input type="date" max="9999-12-31" th:field="*{contractEndDate}" class="form-control">
					<div class="error-message" th:if="${#fields.hasErrors('contractEndDate')}"
						th:errors="*{contractEndDate}">
					</div>
				</div>
				<div class="form-group">
					<label>契約単価 <span class="badge-required">必須</span></label>
					<input type="number" th:field="*{unitPrice}" class="form-control" placeholder="例：100000">
					<div class="error-message" th:if="${#fields.hasErrors('unitPrice')}" th:errors="*{unitPrice}">
					</div>
				</div>
				<div class="form-group">
					<label>役割 <span class="badge-required">必須</span></label>
					<select th:field="*{roleId}" class="dropdown form-control">
						<option th:value="">未選択</option>
						<option th:each="assignment : ${assignments}" th:value="${assignmenrt.roleId}"
							th:text="${assignment.role}">
						</option>
					</select>
					<div class="error-message" th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}">
					</div>
				</div>
				<div class="form-actions">
					<button type="submit" class="btn btn-primary">更新</button>
					<a th:if="${fromPage=='detail'}" th:href="@{/assignments/{id}(id=${assignmentForm.assignmentId})}"
						class="btn btn-secondary">戻る</a>
					<a th:if="${fromPage != 'detail'}" th:href="@{/assignments}" class="btn btn-secondary">戻る</a>
				</div>
			</form>
		</div>
	</div>
</body>

</html>
