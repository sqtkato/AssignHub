<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>アサイン履歴情報一覧</title>
	<link rel="stylesheet" th:href="@{/css/assignment.css}">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>アサイン履歴情報一覧</h2>
		</div>

		<div class="card">
			<form th:action="@{/assignments}" method="get" th:object="${searchForm}" class="search-form" novalidate>
				<div class="search-row">
					<div class="form-group form-group-search">
						<div class="form-group">
							<label>社員名</label>
							<input type="text" th:field="txtEmpName" id="txt_emp_name" name="txt_emp_name" maxlength="100"
								class="form-control" th:value="${txt_emp_name}" placeholder="例：山田">
						</div>
						<div class="form-group">
							<label>アサイン先企業</label>
							<input type="text" th:field="txtAssignName" id="txt_assign_name" name="txt_assign_name" maxlength="50"
								class="form-control" th:value="${txt_assign_name}" placeholder="例：株式会社ABC">
						</div>
					</div>
					<div class="form-group form-group-search">
						<div class="form-group">
							<label>契約期間</label>
							<div class="date-range">
								<input type="date" th:field="*{txtContractStartDate}" id="txt_contract_start_date" name="txt_contract_start_date"
									class="form-control" th:value="${txt_contract_start_date}">
								<span class="date-range-sep">～</span>
								<input type="date" th:field="*{txtContractEndDate}" id="txt_contract_end_date" name="txt_contract_end_date"
									class="form-control" th:value="${txt_contract_end_date}">
							</div>
						</div>
						<div class="form-group">
							<label>所属企業</label>
							<input type="text" th:field="txtCompanyName" id="txt_company_name" name="txt_company_name" maxlength="50"
								class="form-control" th:value="${txt_company_name}" placeholder="例：株式会社ABC">
						</div>
					</div>
				</div>
				<div class="search-button-area">
					<button type="submit" id="btn_assign_search" class="btn btn-secondary">検索</button>
				</div>
			</form>
		</div>

		<form th:action="@{/assignments/bulk-delete}" method="post" id="listForm">
			<div class="table-toolbar">
				<button type="button" id="btn_assign_import" class="toolbar-btn toolbar-btn-secondary"
					th:onclick="|location.href='@{/assignments/import}'|">
					インポート
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
						<polyline points="7 10 12 15 17 10"></polyline>
						<line x1="12" y1="15" x2="12" y2="3"></line>
					</svg>
				</button>
				<button type="submit" id="btn_assign_export" th:formaction="@{/assignments/export}"
					class="toolbar-btn toolbar-btn-secondary">
					エクスポート
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
						<polyline points="17 8 12 3 7 8"></polyline>
						<line x1="12" y1="3" x2="12" y2="15"></line>
					</svg>
				</button>
				<button type="button" id="btn_assign_bulkDelete" class="toolbar-btn toolbar-btn-danger"
					onclick="openBulkDeleteModal()">
					一括削除
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
					</svg>
				</button>
				<button type="button" id="btn_assign_create" class="toolbar-btn toolbar-btn-primary"
					th:onclick="|location.href='@{/assignments/new}'|">
					新規登録
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<line x1="12" y1="5" x2="12" y2="19"></line>
						<line x1="5" y1="12" x2="19" y2="12"></line>
					</svg>
				</button>
			</div>

			<div class="card">
				<table class="table">
					<thead class="table-dark" style="position: sticky; top: 0; z-index: 1;">
						<tr>
							<th class="col-checkbox">
								<input type="checkbox" id="chk_assign_selectAll" class="select-all">
							</th>
							<th>ID</th>
							<th>社員名</th>
							<th>アサイン先企業</th>
							<th>所属企業</th>
							<th>契約開始日</th>
							<th>契約終了日</th>
							<th>単価</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="assign : ${assignments}" class="clickable-row">
							<td class="col-checkbox">
								<input type="checkbox" name="ids" th:value="${assign.assignmentId}"
									class="chk_assign_select row-checkbox">
							</td>
							<td th:text="${assign.assignmentId}"></td>
							<td th:text="${assign.empName}"></td>
							<td th:text="${assign.assignCompanyName}"></td>
							<td th:text="${assign.companyName}"></td>
							<td th:text="${assign.contractStartDate}"></td>
							<td th:text="${assign.contractEndDate != null ? assign.contractEndDate : 'ー'}"></td>
							<td th:text="${assign.unitPrice}"></td>
							<td>
								<button type="button" class="btn_assign_detail btn-icon-svg detail" title="詳細"
									th:onclick="|location.href='@{/assignments/{id}(id=${assign.assignmentId})}'|">
									<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
										stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
										<circle cx="12" cy="12" r="10"></circle>
										<path d="M12 16v-4"></path>
										<path d="M12 8h.01"></path>
									</svg>
								</button>

								<button type="button" class="btn_assign_edit btn-icon-svg edit" title="編集"
									th:onclick="|location.href='@{/assignments/{id}/edit(id=${assign.assignmentId}, from='index')}'|">
									<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
										stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
										<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
										<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
									</svg>
								</button>
								<button type="button" class="btn_assign_delete btn-icon-svg delete" title="削除"
									th:onclick="|openDeleteModal(${assign.assignmentId})|">
									<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
										stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
										<polyline points="3 6 5 6 21 6"></polyline>
										<path
											d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
										</path>
									</svg>
								</button>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(assignments)}">
							<td colspan="9" class="text-center">該当するデータがありません。</td>
						</tr>
					</tbody>
				</table>
			</div>
		</form>
		<!-- 削除確認モーダル -->
		<div id="deleteOverlay" class="modal-overlay">
			<div class="modal-box">
				<div class="modal-icon modal-icon-danger">
					<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
						stroke="#dc3545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
					</svg>
				</div>
				<p class="modal-title">アサイン履歴情報を削除しますか？</p>
				<p class="modal-subtitle">この操作は取り消せません。</p>
				<div class="modal-actions">
					<button type="button" onclick="closeDeleteModal()" class="modal-btn modal-btn-cancel">キャンセル</button>
					<form id="deleteForm" method="post">
						<button type="submit" class="modal-btn modal-btn-danger">削除する</button>
					</form>
				</div>
			</div>
		</div>
		<!-- 一括削除確認モーダル -->
		<div id="bulkDeleteOverlay" class="modal-overlay">
			<div class="modal-box">
				<div class="modal-icon modal-icon-danger">
					<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
						stroke="#dc3545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
					</svg>
				</div>
				<p class="modal-title">選択したアサイン履歴情報を削除しますか？</p>
				<p class="modal-subtitle">この操作は取り消せません。</p>
				<div class="modal-actions">
					<button type="button" onclick="closeBulkDeleteModal()"
						class="modal-btn modal-btn-cancel">キャンセル</button>
					<button type="button" onclick="submitBulkDelete()" class="modal-btn modal-btn-danger">削除する</button>
				</div>
			</div>
		</div>
		<!-- 未選択エラーモーダル -->
		<div id="noSelectionOverlay" class="modal-overlay">
			<div class="modal-box">
				<div class="modal-icon modal-icon-warning">
					<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
						stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path
							d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
						</path>
						<line x1="12" y1="9" x2="12" y2="13"></line>
						<line x1="12" y1="17" x2="12.01" y2="17"></line>
					</svg>
				</div>
				<p class="modal-title">アサイン履歴情報が選択されていません</p>
				<p class="modal-subtitle">削除するアサイン履歴情報をチェックしてください。</p>
				<div class="modal-actions">
					<button type="button" onclick="closeNoSelectionModal()"
						class="modal-btn modal-btn-cancel">OK</button>
				</div>
			</div>
		</div>
		<script th:src="@{/js/assignment.js}"></script>
	</div>
</body>

</html>
