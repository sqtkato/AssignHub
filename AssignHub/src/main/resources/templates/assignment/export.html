<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>アサイン履歴情報エクスポート</title>
</head>

<body>
<div layout:fragment="content">

    <div class="page-title-area">
        <h2>アサイン履歴情報エクスポート</h2>
    </div>

    <div class="card form-card">
        <p>
            <span th:text="${count}">0</span>件のアサイン履歴情報をCSV出力します。
        </p>

        <table class="table">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>社員名</th>
                <th>アサイン先企業名</th>
                <th>契約開始日</th>
                <th>契約終了日</th>
                <th>契約単価</th>
                <th>役割</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="assign : ${assignments}">
                <td th:text="${assign.assignmentId}"></td>
                <td th:text="${assign.empName}"></td>
                <td th:text="${assign.companyName}"></td>
                <td th:text="${assign.contractStartDate}"></td>
                <td th:text="${assign.contractEndDate != null ? assign.contractEndDate : 'ー'}"></td>
                <td th:text="${assign.unitPrice}"></td>
                <td th:text="${assign.role}"></td>
            </tr>
            </tbody>
        </table>

        <form th:action="@{/assignments/export/download}" method="get" class="form-actions">
            <input type="hidden"
                   name="ids"
                   th:each="id : ${ids}"
                   th:value="${id}">
            <button type="submit" class="btn btn-primary">CSVダウンロード</button>
            <a th:href="@{/assignments}" class="btn btn-secondary">戻る</a>
        </form>
    </div>

</div>
</body>
</html>
