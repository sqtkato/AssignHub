<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>社員情報エクスポート</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>社員情報エクスポート</h2>
		</div>
		<div class="card form-card-wide">
			<p class="instruction">以下の条件と内容でCSVファイルを出力します。<br>よろしければ「エクスポート」ボタンを押してください。</p>

			<div class="export-confirm-box">
				<h4 class="export-confirm-title">出力条件の確認</h4>
				<table class="export-table">
					<tr>
						<td class="label">出力対象件数:</td>
						<td class="value"><span class="export-count" th:text="${ids}">0</span> 件</td>
					</tr>
					<tr>
						<td class="label">文字コード:</td>
						<td class="value">UTF-8 (BOMあり)</td>
					</tr>
				</table>
				<p class="export-note">※出力される項目：アサインID,社員名,アサイン先企業名,作成日時,更新日時,契約開始日,契約終了日,契約単価,役割</p>
			</div>

		</div>
		<div class="action-area">
			<a th:href="@{/assignments/export/download(keyword=${keyword}, ids=${ids})}"
				class="btn btn-primary btn-wide">エクスポート</a>
			<a th:href="@{/assignments}" class="btn btn-secondary btn-wide">戻る</a>
		</div>
	</div>
</body>

</html>
