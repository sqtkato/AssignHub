<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>アサイン履歴情報削除/復元一覧</title>
	<link rel="stylesheet" th:href="@{/css/assignment.css}">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>アサイン履歴情報削除/復元一覧</h2>
		</div>
		<div class="card">
			<form th:action="@{/deleted-assignments}" method="get" th:object="${searchForm}" class="search-form"
				novalidate>
				<div class="search-row">
					<div class="form-group form-group-search">
						<div class="form-group">
							<label>社員名</label>
							<input type="text" th:field="*{empName}" maxlength="100" class="form-control"
								placeholder="例：山田">
						</div>
						<div class="form-group">
							<label>アサイン先企業</label>
							<input type="text" th:field="*{assignName}" maxlength="50" class="form-control"
								placeholder="例：株式会社ABC">
						</div>
					</div>
					<div class="form-group form-group-search">
						<div class="form-group">
							<label>契約期間</label>
							<div class="date-range">
								<input type="date" th:field="*{contractStartDate}" class="form-control">
								<span class="date-range-sep">～</span>
								<input type="date" th:field="*{contractEndDate}" class="form-control">
							</div>
						</div>
						<div class="form-group">
							<label>所属企業</label>
							<input type="text" th:field="*{companyName}" maxlength="50" class="form-control"
								placeholder="例：株式会社ABC">
						</div>
					</div>
				</div>
				<div class="search-button-area">
					<button type="submit" class="btn btn-secondary">検索</button>
				</div>
			</form>
		</div>

		<form method="post" id="listForm">
			<div class="table-toolbar">
				<button type="submit" formaction="/deleted-assignments/restore-bulk"
					class="toolbar-btn toolbar-btn-primary" title="チェックした項目を復元"
					onclick="return confirm('選択した項目を一括復元しますか？');">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
						style="width: 1.3rem; height: 1.3rem; vertical-align: middle; margin-right: 4px;">
						<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
						<polyline points="3 3 3 8 8 8" />
						<path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
						<polyline points="21 21 21 16 16 16" />
					</svg>
					一括復元
				</button>
				<button type="submit" formmethod="post" formaction="/deleted-assignments/export" class="toolbar-btn"
					title="チェックした項目をエクスポート">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
						<polyline points="17 8 12 3 7 8"></polyline>
						<line x1="12" y1="3" x2="12" y2="15"></line>
					</svg>
					エクスポート
				</button>
				<button type="submit" formaction="/deleted-assignments/delete-bulk"
					class="toolbar-btn toolbar-btn-danger" title="チェックした項目を削除"
					onclick="return confirm('選択した項目を一括削除しますか？');">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
					</svg>
					一括削除
				</button>
			</div>


			<div class="card">
				<div class="table-scroll">
					<table class="table">
						<thead class="table-dark" style="position: sticky; top: 0; z-index: 1;">
							<thead class="table-dark" style="position: sticky; top: 0; z-index: 1;">
								<tr>
									<th class="col-checkbox">
										<input type="checkbox" class="select-all">
									</th>
									<th>ID</th>
									<th>社員名</th>
									<th>アサイン先企業</th>
									<th>所属企業</th>
									<th>契約開始日</th>
									<th>契約終了日</th>
									<th>単価</th>
									<th>操作</th>
								</tr>
							</thead>
						<tbody>
							<tr th:each="assign : ${assignments}" class="clickable-row">
								<td class="col-checkbox">
									<input type="checkbox" name="ids" th:value="${assign.assignmentId}"
										class="chk_assign_select row-checkbox">
								</td>
								<td th:text="${assign.assignmentId}"></td>
								<td th:text="${assign.employee.lastName} + ' ' + ${assign.employee.firstName}"></td>
								<td th:text="${assign.company.companyName}"></td>
								<td
									th:text="${assign.employee.company != null ? assign.employee.company.companyName :'ー'}">
								</td>
								<td th:text="${assign.contractStartDate}"></td>
								<td th:text="${assign.contractEndDate != null ? assign.contractEndDate : 'ー'}"></td>
								<td th:text="${assign.unitPrice}"></td>
								<td>
									<button type="button" th:attr="data-id=${assign.assignmentId}" class="btn-icon-svg"
										title="復元" onclick="openRestoreModal(this.dataset.id)">
										<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
											stroke="currentColor" stroke-width="3" stroke-linecap="round"
											stroke-linejoin="round"
											style="width: 1.3rem; height: 1.3rem; vertical-align: middle; margin-right: 4px;">
											<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
											<polyline points="3 3 3 8 8 8" />
											<path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
											<polyline points="21 21 21 16 16 16" />
										</svg>
									</button>
									<button type="button" class="btn_assign_delete btn-icon-svg delete" title="削除"
										th:onclick="|openDeleteModal(${assign.assignmentId})|">
										<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
											stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
											<polyline points="3 6 5 6 21 6"></polyline>
											<path
												d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
											</path>
										</svg>
									</button>
								</td>
							</tr>
							<tr th:if="${#lists.isEmpty(assignments)}">
								<td colspan="9" class="text-center">該当するデータがありません。</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</form>
	</div>

</body>

</html>
