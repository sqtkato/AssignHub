<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アカウント情報の新規登録</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="container">
    <h2>アカウント情報の新規登録</h2>

    <form th:action="@{/accounts/create}" method="post" th:object="${account}">

        <div class="form-group">
            <label>ログインID</label>
            <input type="text" th:field="*{loginId}">
        </div>

        <div class="form-group">
            <label>パスワード</label>
            <input type="password" th:field="*{passwordHash}">
        </div>

        <div class="form-group">
            <label>権限付与</label>
            <select th:field="*{permission}">
                <option value="0">一般</option>
                <option value="1">管理</option>
            </select>
        </div>

        <div class="button-area">
            <button type="submit">登録</button>
            <a th:href="@{/accounts}">
                <button type="button">戻る</button>
            </a>
        </div>

    </form>
</div>

</body>
</html>
