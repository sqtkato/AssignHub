<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>アカウント情報インポート</title>
</head>
<body>

    <div class="main">
        <h2>アカウント情報のインポート</h2>

        <p class="desc">
            CSVファイルを選択してアカウント情報を一括登録・更新します。<br>
            ※既存のログインIDと一致する場合は上書き更新、空欄の場合は新規登録されます。
        </p>

        <form th:action="@{/accounts/import}" method="post" enctype="multipart/form-data">
            <div class="upload-box">
                <div class="big">アカウントデータCSVを選択してください</div>
                <div class="small">対応形式: .csv (UTF-8) / BOMあり推奨、最大5M</div>
                <div class="file-inner">
                    <input type="file" name="file" accept=".csv">
                </div>
                <p th:if="${fileError}" th:text="${fileError}" style="color:red; margin-top:15px;"></p>
            </div>

            <div class="btn-area">
                <button type="submit" class="btn btn-import">インポート</button>
                <button type="button" class="btn btn-back" onclick="history.back()">戻る</button>
            </div>
        </form>

        <hr class="divider">

        <div class="result" th:if="${done}">
            <h3>
                処理結果
                <span th:if="${globalError}" th:text="${globalError}"
                      style="color:red; font-size:14px; font-weight:normal; margin-left:15px;"></span>
            </h3>
            <div class="result-cards">
                <div class="card card-success">
                    <div class="label">正常取り込み</div>
                    <div class="num" th:text="${successCount} + '件'">0件</div>
                </div>
                <div class="card card-error">
                    <div class="label">エラー</div>
                    <div class="num" th:text="${errorCount} + '件'">0件</div>
                </div>
            </div>

            <div th:if="${errorCount > 0 and globalError == null}">
                <p class="err-msg">
                    以下の行でエラーが発生したため、取り込みをキャンセルしました。<br>
                    内容を修正して再アップロードしてください。
                </p>
                <table class="err-table">
                    <thead>
                        <tr>
                            <th>行数</th>
                            <th>対象項目</th>
                            <th>エラー内容</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="err : ${errors}">
                            <td th:text="${err.row}"></td>
                            <td th:text="${err.target}"></td>
                            <td th:text="${err.message}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
