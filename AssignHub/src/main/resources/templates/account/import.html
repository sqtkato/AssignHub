<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title>アカウント情報インポート</title>


	<!-- CSSを外部ファイルに分離（import.css）-->
	<link rel="stylesheet" th:href="@{/css/import.css}">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>アカウント情報のインポート</h2>
		</div>

		<p class="import-desc">
			CSVファイルを選択してアカウント情報を一括登録・更新します。<br>
			※既存のアカウントIDと一致する場合は上書き更新、空欄の場合は新規登録されます。
		</p>

		<form th:action="@{/accounts/import}" method="post" enctype="multipart/form-data">
			<div class="upload-box">
				<div class="big">アカウントデータCSVを選択してください</div>
				<div class="small">対応形式: .csv (UTF-8) / BOMあり推奨、最大5M</div>
				<div class="file-inner">
					<input type="file" name="file" accept=".csv">
				</div>
				
				<div style="text-align: right; margin-top: 20px;">
					<a th:href="@{/accounts/import/template}" class="template-link">
						📥 CSVテンプレートをダウンロード
					</a>
			</div>
			</div>

			<div class="btn-area">
				<button type="submit" class="import-btn import-btn-do">インポート</button>
				<a th:href="@{/accounts}" class="import-btn import-btn-back" style="text-decoration:none; display:inline-block;">戻る</a>
			</div>

				<!-- エラーメッセージ：ボタンの下に表示（設計書通り）-->

			<p th:if="${fileError}" th:text="${fileError}" class="file-error"></p>
			
		</form>

		<hr class="import-divider">


		<div class="result" th:if="${done}">
			<h3>
				処理結果
				<span th:if="${globalError}" th:text="${globalError}"
					style="color:red; font-size:14px; font-weight:normal; margin-left:15px;"></span>
			</h3>

			<div class="result-cards">
				<div class="result-card card-success">
					<div class="label">正常取り込み</div>

					<div class="num" th:text="${successCount} + '件'">0件</div>

				</div>
				<div class="result-card card-error">
					<div class="label">エラー</div>

					<div class="num" th:text="${errorCount} + '件'">0件</div>

				</div>
			</div>

			<div th:if="${importResult.errorCount > 0}">
				<p class="err-msg">
					以下の行でエラーが発生したため、取り込みをキャンセルしました。<br>
					内容を修正して再アップロードしてください。
				</p>
				<table class="err-table">
					<thead>
						<tr>
							<th>行数</th>
							<th>対象項目</th>
							<th>エラー内容</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="error : ${importResult.errors}">
							<td th:text="${error.rowNum} + '行目'"></td>
							<td th:text="${error.field}"></td>
							<td th:text="${error.message}"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</body>

</html>
