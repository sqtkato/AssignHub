<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>論理削除社員情報エクスポート</title>
	<meta charset="utf-8">
	<link rel="stylesheet" th:href="@{/css/employee.css}">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>論理削除社員情報エクスポート</h2>
		</div>
		<div class="card form-card-wide">
			<p class="instruction">以下の内容でcsvファイルを出力します。<br>よろしければ「エクスポート」ボタンを教えてください。</p>
			<div class="export-confirm-box">
				<h4 class="export-confirm-title">出力条件の確認</h4>
				<table class="export-table">
					<tr>
						<td>出力対象件数:</td>
						<td><span class="export-count" th:text="${count}">0</span> 件</td>
					</tr>
					<tr>
						<td>文字コード:</td>
						<td>UTF-8 (BOMあり)</td>
					</tr>
				</table>
				<div class="table-scroll export-table">
					<table class="table header-only-table table-dark">
						<thead>
							<tr>
								<th>社員ID</th>
								<th>社員名</th>
								<th>アサイン先企業</th>
								<th>所属企業</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="emp : ${employees}" class="clickable-row">
								<td th:text="${emp.empId}"></td>
								<td th:text="${emp.lastName} + ' ' + ${emp.firstName}"></td>
								<td th:text="${emp.assignment?.company?.companyName} ?: 'ー'"></td>
								<td th:text="${emp.company?.companyName} ?: 'ー'"></td>
							</tr>
						</tbody>
					</table>
				</div>
				<p class="export-note">※ 詳細情報がエクスポートされます</p>
			</div>
			<div class="action-area">
				<form th:action="@{/deleted-employees/export/download(ids=${ids})}" method="post">
					<div class="action-area action-area-wide">
						<button type="submit" class="btn-export">エクスポート</button>
						<button type="button" class="btn-back" th:onclick="|location.href='@{/deleted-employees}'|">戻る</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
