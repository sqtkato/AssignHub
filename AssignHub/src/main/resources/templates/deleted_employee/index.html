<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title>社員情報削除/復元一覧</title>
	<link rel="stylesheet" href="/css/popup.css">
	<link rel="stylesheet" href="/css/employee.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>社員情報削除/復元一覧</h2>
		</div>

		<div class="card">
			<form th:action="@{/deleted-employees}" method="get" class="search-form">
				<div class="form-group form-group-search">
					<div class="search-item">
						<label>社員名</label>
						<input type="text" name="empName" class="form-control" th:value="${empName}"
							placeholder="例：山田 太郎">
					</div>
					<div class="search-item">
						<label>アサイン先企業</label>
						<input type="text" name="empAssignCompany" class="form-control" th:value="${empAssignCompany}"
							placeholder="例：株式会社システム">
					</div>
					<div class="search-item">
						<label>所属企業</label>
						<input type="text" name="empCompany" class="form-control" th:value="${empCompany}"
							placeholder="例：株式会社システム">
					</div>
					<div class="search-item">
						<label>エンジニアタイプ</label>
						<select name="empEngineerType" class="form-control">
							<option value>未選択</option>
							<option value="プロパー" th:selected="${empEngineerType == 'プロパー'}">プロパー</option>
							<option value="パートナー" th:selected="${empEngineerType == 'パートナー'}">パートナー</option>
						</select>
					</div>
				</div>
				<button type="submit" class="btn-search btn-search-position">検索</button>
			</form>
		</div>

		<form method="post" id="listForm">
			<div class="table-toolbar">
				<button type="button" class="toolbar-btn toolbar-btn-primary" title="チェックした項目を復元"
					onclick="openBulkRestoreModal()">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
						style="width: 1.3rem; height: 1.3rem; vertical-align: middle; margin-right: 4px;">
						<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
						<polyline points="3 3 3 8 8 8" />
						<path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
						<polyline points="21 21 21 16 16 16" />
					</svg>
					一括復元
				</button>

				<button type="submit" formaction="/deleted-employees/export" class="toolbar-btn"
					title="チェックした項目をエクスポート">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
						<polyline points="17 8 12 3 7 8"></polyline>
						<line x1="12" y1="3" x2="12" y2="15"></line>
					</svg>
					エクスポート
				</button>

				<button type="button" class="toolbar-btn toolbar-btn-danger" title="チェックした項目を削除"
					onclick="openBulkDeleteModal()">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
						</path>
					</svg>
					一括削除
				</button>
			</div>

			<div class="card">
				<div class="table-scroll">
					<table class="table employee-table">
						<thead class="table-dark">
							<tr>
								<th class="col-checkbox"><input type="checkbox" id="selectAll"></th>
								<th>ID</th>
								<th>社員名</th>
								<th>アサイン先企業</th>
								<th>エンジニアタイプ</th>
								<th>所属先企業</th>
								<th class="col-action">操作</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="emp : ${employees}" class="clickable-row">
								<td class="col-checkbox">
									<input type="checkbox" name="ids" th:value="${emp.empId}" class="row-checkbox">
								</td>
								<td th:text="${emp.empId}"></td>
								<td th:text="${emp.lastName} + ' ' + ${emp.firstName}"></td>
								<td th:text="${emp.assignment?.company?.companyName} ?: 'ー'"></td>
								<td th:text="${emp.engineerType}"></td>
								<td th:text="${emp.company?.companyName} ?: 'ー'"></td>
								<td class="col-action">
									<button type="button" th:attr="data-id=${emp.empId}" class="btn-icon-svg" title="復元"
										onclick="openRestoreModal(this.dataset.id)" style="vertical-align: middle;">
										<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
											stroke="currentColor" stroke-width="3" stroke-linecap="round"
											stroke-linejoin="round"
											style="width: 1.8rem; height: 1.8rem; display: block; margin: auto;">
											<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
											<polyline points="3 3 3 8 8 8" />
											<path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
											<polyline points="21 21 21 16 16 16" />
										</svg>
									</button>

									<button type="button" th:attr="data-id=${emp.empId}" class="btn-icon-svg delete"
										title="削除" onclick="openDeleteModal(this.dataset.id)">
										<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
											stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
											<polyline points="3 6 5 6 21 6"></polyline>
											<path
												d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
											</path>
										</svg>
									</button>
								</td>
							</tr>
							<tr th:if="${#lists.isEmpty(employees)}">
								<td colspan="6" class="text-center">該当するデータがありません。</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</form>
	</div>
</body>

</html>
