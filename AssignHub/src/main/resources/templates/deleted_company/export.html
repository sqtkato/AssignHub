<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>論理削除企業情報エクスポート</title>

	<meta charset="UTF-8">
	<title>Insert title here</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>論理削除企業情報エクスポート</h2>
		</div>
		<div class="card form-card-wide">
			<p class="instruction">以下の条件と内容でCSVファイルを出力します。よろしければ「エクスポート」ボタンを押してください。</p>

			<div class="export-confirm-box">
				<h4 class="export-confirm-title">出力条件の確認</h4>
				<table class="export-table">
					<tr>
						<td class="label">検索キーワード:</td>
						<td class="value" th:text="${keyword != null and keyword != '' ? keyword : '（指定なし）'}"></td>
					</tr>
					<tr>
						<td class="label">出力対象件数:</td>
						<td class="value"><span class="export-count" th:text="${count}">0</span> 件</td>
					</tr>
					<tr>
						<td class="label">文字コード:</td>
						<td class="value">UTF-8 (BOMあり)</td>
					</tr>
				</table>
			</div>
			
			<div class="table-scroll export-table">
							<table class="table table-dark">
								<thead>
									<tr>
										<th>企業ID</th>
										<th>企業名</th>
										<th>住所1</th>
										<th>TEL</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="company : ${companies}">
										<td th:text="${company.compId}"></td>
										<td th:text="${company.compName}"></td>
										<td th:text="${company.compAddress1}"></td>						
										<td th:text="${company.compTel}"></td>
									</tr>
								</tbody>
							</table>
						</div>

			<div class="action-area">
				<a th:href="@{/companies/export/download(keyword=${keyword}, deptId=${deptId})}"
					class="btn btn-primary btn-wide">エクスポート</a>
				<a th:href="@{/companies}" class="btn btn-secondary btn-wide">戻る</a>
			</div>
			<p class="export-note">※詳細情報がエクスポートされます</p>
		</div>
	</div>

</body>

</html>
