<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>論理削除企業情報エクスポート</title>
	<meta charset="UTF-8">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>論理削除企業情報エクスポート</h2>
		</div>
		<div class="card form-card-wide">
			<p class="instruction">以下の条件と内容でCSVファイルを出力します。<br>よろしければ「エクスポート」ボタンを押してください。</p>

			<div class="export-confirm-box">
				<h4 class="export-confirm-title">出力条件の確認</h4>
				<table class="export-table">
					<tr>
						<td class="label">出力対象件数:</td>
						<td class="value"><span class="export-count" th:text="${count}">0</span> 件</td>
					</tr>
					<tr>
						<td class="label">文字コード:</td>
						<td class="value">UTF-8 (BOMあり)</td>
					</tr>
				</table>
			
				<div class="table-scroll export-table">
					<table class="table header-only-table table-dark">
						<thead>
							<tr>
								<th>企業ID</th>
								<th>企業名</th>
								<th>住所1</th>
								<th>TEL</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="company : ${companies}" class="clickable-row">
								<td th:text="${company.companyId}"></td>
								<td th:text="${company.companyName}"></td>
								<td th:text="${company.companyAddress1}"></td>						
								<td th:text="${company.companyTel}"></td>
							</tr>
						</tbody>
					</table>
				</div>
					<p class="export-note">※詳細情報がエクスポートされます</p>
			</div>			
					<div class="action-area">
		    			<form th:action="@{/deleted-companies/export/download}" method="post">
			       			<input type="hidden" name="ids" th:each="id : ${ids}" th:value="${id}">
			        		<button type="submit" class="btn-csv">エクスポート</button>
							<button type="button" id="btn_account_back" class="btn-back"
									th:onclick="|location.href='@{/deleted-companies}'|">戻る</button>
		    			</form>
					</div>		
		</div>
</body>
</html>
