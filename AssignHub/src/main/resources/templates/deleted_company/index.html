<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>企業情報削除/復元一覧</title>
	<link rel="stylesheet" href="/css/popup.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>企業情報削除/復元一覧</h2>
		</div>

		<div class="card acc">
			<form th:action="@{/deleted-companies}" method="get" class="search-form">
				<div class="search-item">
					<label>企業名</label>
					<input type="text" name="companyName" class="form-control" th:value="${companyName}" placeholder="例：テクノ">
				</div>
				<div class="search-item">
					<label>電話番号</label>
					<input type="text" name="companyTel" class="form-control" th:value="${companyTel}" placeholder="例：0901111111">
				</div>
				<button type="submit" class="btn btn-secondary btn-search">検索</button>
			</form>
		</div>

		<form method="post" id="listForm">
			<div class="table-toolbar">
				<button type="button" class="toolbar-btn toolbar-btn-primary" title="チェックした項目を復元" onclick="openBulkRestoreModal()">
    				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        				stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        				style="width: 1.3rem; height: 1.3rem; vertical-align: middle; margin-right: 4px;">
        			<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        			<polyline points="3 3 3 8 8 8" />
        			<path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
        			<polyline points="21 21 21 16 16 16" />
    				</svg>
				    一括復元
				</button>

				<button type="submit" formaction="/deleted-companies/export" class="toolbar-btn" title="チェックした項目をエクスポート">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
						<polyline points="17 8 12 3 7 8"></polyline>
						<line x1="12" y1="3" x2="12" y2="15"></line>
					</svg>
					エクスポート
				</button>

				 <button type="button" class="toolbar-btn toolbar-btn-danger" title="チェックした項目を削除"onclick="openBulkDeleteModal()">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
						</path>
					</svg>
					一括削除
				</button>
				
			</div>

			<div class="card">
				<div class="table-scroll">
					<table class="table">
						<thead class="table-dark">
							<tr>
								<th class="col-checkbox"><input type="checkbox" id="selectAll"></th>
								<th>企業ID</th>
								<th>企業名</th>
								<th>住所1</th>
								<th>TEL</th>
								<th class="col-action">操作</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="company : ${companies}" class="clickable-row">
								<td class="col-checkbox">
									<input type="checkbox" name="ids" th:value="${company.companyId}" class="row-checkbox">
								</td>
								<td th:text="${company.companyId}"></td>
								<td th:text="${company.companyName}"></td>
								<td th:text="${company.companyAddress1}"></td>
								<td th:text="${company.companyTel}"></td>
								<td class="col-action">
								<button type="button" th:attr="data-id=${company.companyId}" class="btn-icon-svg" title="復元" onclick="openRestoreModal(this.dataset.id)"style="vertical-align: middle;">		
									<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
									    stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
									    style="width: 1.8rem; height: 1.8rem; display: block; margin: auto;">
									    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
									    <polyline points="3 3 3 8 8 8" /> 
									    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
									    <polyline points="21 21 21 16 16 16" />
									</svg>
								</button>
												
								<button type="button" th:attr="data-id=${company.companyId}" class="btn-icon-svg delete" title="削除" onclick="openDeleteModal(this.dataset.id)"style="vertical-align: middle;">
									<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
									</svg>
								</button>
											</td>
							</tr>
							
							<tr th:if="${#lists.isEmpty(companies)}">
								<td colspan="6" class="text-center">該当するデータがありません。</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</form>

	</div>
</body>
</html>
