<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>削除アサイン履歴情報エクスポート</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>削除アサイン履歴情報エクスポート</h2>
		</div>
		<div class="card form-card-wide">
			<p class="instruction">以下の条件と内容でCSVファイルを出力します。よろしければ「エクスポート」ボタンを押してください。</p>

			<div class="export-confirm-box">
				<h4 class="export-confirm-title">出力条件の確認</h4>
				<table class="export-table">
					<tr>
						<td class="label">出力対象件数:</td>
						<td class="value"><span class="export-count" th:text="${count}">0</span> 件</td>
					</tr>
					<tr>
						<td class="label">文字コード:</td>
						<td class="value">UTF-8 (BOMあり)</td>
					</tr>
				</table>
			</div>

			<div class="table-scroll export-table">
				<table class="table table-dark">
					<thead>
						<tr>
							<th>アサインID</th>
							<th>社員名</th>
							<th>アサイン先企業</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="assign : ${assigns}">
							<td th:text="${assign.assignmentId}"></td>
							<td th:text="${assign.employee.empName}"></td>
							<td th:text="${assign.company.companyName}"></td>

						</tr>
					</tbody>
				</table>
			</div>


			<form th:action="@{/accounts/export/download(ids=${ids})}" method="post">
						<div class="action-area action-area-wide">
							<button type="submit" class="btn-export">エクスポート</button>
							<button type="button" class="btn-back" th:onclick="|location.href='@{/deleted-employees}'|">戻る</button>
						</div>
					</form>

			<p class="export-note">※詳細情報がエクスポートされます。</p>
		</div>
	</div>
</body>

</html>
