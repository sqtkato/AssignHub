<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
	<title>論理削除アカウント情報一覧</title>
	<link rel="stylesheet" href="/css/popup.css">
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>論理削除アカウント情報一覧</h2>
		</div>

		<div class="card acc">
			<form th:action="@{/accounts}" method="get" class="search-form">
				<div class="form-group form-group-search">

					<div class="search-item">
						<label>権限</label>
						<select name="permission" class="form-control">
							<option value="" th:selected="${permission == null}">未選択</option>
							<option value="0" th:selected="${permission != null and permission == 0}">一般</option>
							<option value="1" th:selected="${permission != null and permission == 1}">管理</option>
						</select>
					</div>
					<div class="search-item">
						<label>社員</label>
						<input type="text" name="keyword" class="form-control" th:value="${keyword}"
							placeholder="例：山田 太郎">
					</div>

				</div>
				<button type="submit" class="btn btn-secondary">🔍</button>
			</form>
		</div>

		<form method="post" id="listForm">
			<div class="table-toolbar">
				<button type="submit" formaction="/accounts/bulk-delete" class="toolbar-btn toolbar-btn-danger"
					title="チェックした項目を削除">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path
							d="M7 16c2.21 0 4-1.79 5-3s2.79-3 5-3a4 4 0 1 1 0 8c-2.21 0-4-1.79-5-3s-2.79-3-5-3a4 4 0 0 0-3.4 1.9" />
						<polyline points="5.5 10 2 12.5 4.5 16" />
					</svg>
					一括復元
				</button>
				<button type="submit" formaction="/accounts/export" class="toolbar-btn toolbar-btn-danger"
					title="チェックした項目を削除">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
						<polyline points="17 8 12 3 7 8"></polyline>
						<line x1="12" y1="3" x2="12" y2="15"></line>
					</svg>
					エクスポート
				</button>
				<button type="submit" formaction="/accounts/bulk-delete" class="toolbar-btn toolbar-btn-danger"
					title="チェックした項目を削除">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
						</path>
					</svg>
					一括削除
				</button>

			</div>

			<div class="card">
				<div class="table-scroll">
					<table class="table">
						<thead class="table-dark">
							<tr>
								<th class="col-checkbox"><input type="checkbox" id="selectAll"></th>
								<th>
									<a class="sortable-header acc_id"></a>
									アカウントID
								</th>
								<th>
									<a class="sortable-header acc_logId"></a>
									ログインID
								</th>
								<th>
									<a class="sortable-header acc_per"></a>
									権限
								</th>
								<th>
									<a class="sortable-header acc_name"></a>
									社員名
								</th>
								<th class="col-action">操作</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="acc : ${accounts}" class="clickable-row">
								<td class="col-checkbox"><input type="checkbox" name="ids" th:value="${acc.accountId}"
										class="row-checkbox"></td>
								<td th:text="${acc.accountId}" class="acc_id"></td>
								<td th:text="${acc.loginId}" class="acc_logId"></td>
								<td th:text="${acc.permission == '1' ? '管理' : '一般'}" class="acc_per"></td>
								<td th:text="${acc.empName}"></td>
								<td class="col-action">
									<a th:href="@{/accounts/{id}/edit(id=${acc.accountId})}" class="btn-icon-svg"
										title="復元">
										<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
											stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
											<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
											<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
										</svg>
									</a>
									<button type="button" th:attr="data-id=${acc.accountId}" class="btn-icon-svg delete"
										title="削除" onclick="openDeleteModal(this.dataset.id)">
										<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
											stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
											<polyline points="3 6 5 6 21 6"></polyline>
											<path
												d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
											</path>
										</svg>
									</button>
								</td>
							</tr>
							<tr th:if="${#lists.isEmpty(accounts)}">
								<td colspan="6" class="text-center">該当するデータがありません。</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</form>


		<!-- 削除確認モーダル -->
		<div id="deleteOverlay" class="modal-overlay">
			<div class="modal-box">
				<div class="modal-icon modal-icon-danger">
					<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
						stroke="#dc3545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
					</svg>
				</div>
				<p class="modal-title">アカウントを削除しますか？</p>
				<p class="modal-subtitle">この操作は取り消せません。</p>
				<div class="modal-actions">
					<button type="button" onclick="closeDeleteModal()" class="modal-btn modal-btn-cancel">キャンセル</button>
					<form id="deleteForm" method="post">
						<button type="submit" class="modal-btn modal-btn-danger">削除する</button>
					</form>
				</div>
			</div>
		</div>

		<!-- 一括削除確認モーダル -->
		<div id="bulkDeleteOverlay" class="modal-overlay">
			<div class="modal-box">
				<div class="modal-icon modal-icon-danger">
					<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
						stroke="#dc3545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<polyline points="3 6 5 6 21 6"></polyline>
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
					</svg>
				</div>
				<p class="modal-title">選択したアカウントを削除しますか？</p>
				<p class="modal-subtitle">この操作は取り消せません。</p>
				<div class="modal-actions">
					<button type="button" onclick="closeBulkDeleteModal()"
						class="modal-btn modal-btn-cancel">キャンセル</button>
					<button type="button" onclick="submitBulkDelete()" class="modal-btn modal-btn-danger">削除する</button>
				</div>
			</div>
		</div>

		<!-- 未選択エラーモーダル -->
		<div id="noSelectionOverlay" class="modal-overlay">
			<div class="modal-box">
				<div class="modal-icon modal-icon-warning">
					<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
						stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path
							d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
						</path>
						<line x1="12" y1="9" x2="12" y2="13"></line>
						<line x1="12" y1="17" x2="12.01" y2="17"></line>
					</svg>
				</div>
				<p class="modal-title">アカウントが選択されていません</p>
				<p class="modal-subtitle">削除するアカウントをチェックしてください。</p>
				<div class="modal-actions">
					<button type="button" onclick="closeNoSelectionModal()"
						class="modal-btn modal-btn-cancel">OK</button>
				</div>
			</div>
		</div>

		<script src="/js/account.js"></script>

	</div>
</body>

</html>
