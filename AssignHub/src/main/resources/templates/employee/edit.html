<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>社員情報変更入力</title>
</head>

<body>

	<h2>社員情報変更入力</h2>

	<form th:action="@{/employees/{id}/edit(id=${id})}" th:object="${employeeForm}" method="post">
			
		<label>社員ID</label>
		<div th:text="*{empId}"></div>
		<input type="hidden" th:field="*{empId}">
		<div>

			<label>社員姓</label>
			<div></div>
			<input type="text" th:field="*{lastName}" th:classappend="${#fields.hasErrors('lastName')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
		</div>
		<div>
			<label>社員名</label>
			<div></div>
			<input type="text" th:field="*{firstName}"
				th:classappend="${#fields.hasErrors('firstName')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
		</div>
		<div>
			<label>社員姓カナ</label>
			<div></div>
			<input type="text" th:field="*{lastNameKana}"
				th:classappend="${#fields.hasErrors('lastNameKana')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('lastNameKana')}" th:errors="*{lastNameKana}"></div>
		</div>
		<div>
			<label>社員名カナ</label>
			<div></div>
			<input type="text" th:field="*{firstNameKana}"
				th:classappend="${#fields.hasErrors('firstNameKana')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('firstNameKana')}" th:errors="*{firstNameKana}"></div>
		</div>
		<div>
			<label>生年月日</label>
			<div></div>
			<input type="text" th:field="*{birthDate}"
				th:classappend="${#fields.hasErrors('birthDate')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
		</div>
		<div>
			<label>入社年月</label>
			<div></div>
			<input type="text" th:field="*{hireDate}" th:classappend="${#fields.hasErrors('hireDate')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('hireDate')}" th:errors="*{hireDate}"></div>
		</div>
		<div>
			<label>勤続年数</label>
			<div></div>
			<input type="text" th:field="*{yearsOfService}"
				th:classappend="${#fields.hasErrors('yearsOfService')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('yearsOfService')}" th:errors="*{yearsOfService}">
			</div>
		</div>
		<div>
			<label>郵便番号</label>
			<div></div>
			<input type="text" th:field="*{zipCode}" th:classappend="${#fields.hasErrors('zipCode')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('zipCode')}" th:errors="*{zipCode}"></div>
		</div>
		<div>
			<label>住所１</label>
			<div></div>
			<input type="text" th:field="*{Address1}" th:classappend="${#fields.hasErrors('Address1')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('Address1')}" th:errors="*{Address1}"></div>
		</div>
		<div>
			<label>住所２</label>
			<div></div>
			<input type="text" th:field="*{Address2}" th:classappend="${#fields.hasErrors('Address2')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('Address2')}" th:errors="*{Address2}"></div>
		</div>
		<div>
			<label>電話番号</label>
			<div></div>
			<input type="text" th:field="*{empTel}" th:classappend="${#fields.hasErrors('empTel')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('empTel')}" th:errors="*{empTel}"></div>
		</div>
		<div>
			<label>メールアドレス</label>
			<div></div>
			<input type="text" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'input-error'">
			<div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
		</div>
		<div>

			<!-- エンジニアタイプ -->
			<label>エンジニアタイプ</label>
			<div></div>
			<select id="engineerType" name="engineerType">
				    <option value="">未選択</option>
				    <option value="プロパー">プロパー</option>
				    <option value="パートナー">パートナー</option>
			</select>

			<!-- ログインID（プロパーのときだけ表示） -->
			<div id="loginIdArea" style="display: none;"
			>
				    <label>ログインID</label><br>
				  
				<select id="loginId" name="loginId">
					    <option value="">未選択</option>
					<option th:each="account : ${accounts}"
					               th:value="${account.accountId}"
					               th:text="${account.loginId}">
					       </option>
				</select>
				<div class="error-message" th:if="${#fields.hasErrors('accountId')}" 
				th:errors="*{accountId}"></div>
			</div>

			<!-- 所属企業（パートナーのときだけ表示） -->
			<div id="companyArea" style="display: none;">
				    <label>所属企業</label><br>
				  
				<select id="companyName" name="companyName">
					   <option value="">未選択</option>
					<option th:each="company : ${companies}"
					               th:value="${company.companyId}"
					               th:text="${company.companyName}">
					       </option>
				</select>
				<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
			</div>

			<script>
				document.getElementById('engineerType').addEventListener('change', function () {
					const loginIdArea = document.getElementById('loginIdArea');
					const companyArea = document.getElementById('companyArea');

					if (this.value === 'プロパー') {
						loginIdArea.style.display = 'block';
						companyArea.style.display = 'none';
					} else if (this.value === 'パートナー') {
						loginIdArea.style.display = 'none';
						companyArea.style.display = 'block';
					} else {
						loginIdArea.style.display = 'none';
						companyArea.style.display = 'none';
					}
				});
			</script>


			<div>
				<label>所属部署</label>
				<div></div>
				<input type="text" th:field="*{department}"
					th:classappend="${#fields.hasErrors('department')} ? 'input-error'">
				<div class="error-message" th:if="${#fields.hasErrors('department')}" th:errors="*{department}">
				</div>
			</div>
			<div>
				<label>役職</label>
				<div></div>
				<input type="text" th:field="*{jobTitle}"
					th:classappend="${#fields.hasErrors('jobTitle')} ? 'input-error'">
				<div class="error-message" th:if="${#fields.hasErrors('jobTitle')}" th:errors="*{jobTitle}">
				</div>
			</div>
			<div>
	
	<div>
		<button type="submit">変更</button>
		<a th:href="@{/employees}">戻る</a>
	</div>
	</form>

	</div>
</body>

</html>
