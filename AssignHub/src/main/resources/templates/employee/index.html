<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>社員情報一覧</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>社員情報一覧</h2>
		</div>

		<div class="card">
			<form th:action="@{/employees}" method="get" class="search-form">
				<div class="form-group form-group-search">
					<label>社員名</label>
					<input type="text" name="keyword_name" class="form-control" th:value="${keyword_name}" placeholder="例：山田 太郎">
				</div>
			    <div class="form-group form-group-search">
					<label>アサイン先企業</label>
					<input type="text" name="keyword_company_assign" class="form-control" th:value="${keyword_company_assign}" placeholder="例：山田 太郎">
				</div>
				<div class="form-group form-group-search">
					<label>所属企業</label>
					<input type="text" name="keyword_company" class="form-control" th:value="${keyword_company}" placeholder="例：山田 太郎">
				</div>
				<div class="form-group form-group-search">
					<label>エンジニアタイプ</label>
					<select id="keyword_engineer_type" name="keyword_engineer_type" class="form-control">
					<option value>未選択</option>
					<option value="プロパー" th:selected="${keyword_engineer_type == 'プロパー'}">プロパー</option>
					<option value="パートナー" th:selected="${keyword_engineer_type == 'パートナー'}">パートナー</option>
					</select>
				</div>
			    <button type="submit" class="btn btn-secondary">検索</button>
		    </form>
		</div>

		<form th:action="@{/employees/bulk-delete}" method="post" id="listForm">
			<div class="table-toolbar">
					<a th:href="@{/employees/import}" class="toolbar-btn" title="CSVファイルから一括登録">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-linecap="round" stroke-linejoin="round">
							<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
							<polyline points="7 10 12 15 17 10"></polyline>
							<line x1="12" y1="15" x2="12" y2="3"></line>
						</svg>
						インポート
					</a>
					<a th:href="@{/employees/export}" class="toolbar-btn"
						title="現在の検索条件でCSV出力">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-linecap="round" stroke-linejoin="round">
							<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
							<polyline points="17 8 12 3 7 8"></polyline>
							<line x1="12" y1="3" x2="12" y2="15"></line>
						</svg>
						エクスポート
					</a>
					<button type="submit" class="toolbar-btn toolbar-btn-danger" title="チェックした項目を削除"
						onclick="return confirm('選択した項目を一括削除しますか？');">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-linecap="round" stroke-linejoin="round">
							<polyline points="3 6 5 6 21 6"></polyline>
							<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
						</svg>
						一括削除
					</button>
				    <a th:href="@{/employees/new}" class="toolbar-btn toolbar-btn-primary" title="新しい社員を登録">
					    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						    stroke-linecap="round" stroke-linejoin="round">
						    <line x1="12" y1="5" x2="12" y2="19"></line>
						    <line x1="5" y1="12" x2="19" y2="12"></line>
					    </svg>
					    新規登録
				    </a>
			</div>

			<div class="card">
				<table class="table">
					<thead class="table-dark">
						<tr>
							<th class="col-checkbox"><input type="checkbox" id="selectAll"></th>
							<th>
								<a class="sortable-header"
									th:href="@{/employees(keyword=${keyword}, sort='emp_id', order=${currentSort == 'emp_id' and currentOrder == 'asc' ? 'desc' : 'asc'})}">
									ID 
								</a>
							</th>
							<th>
								<a class="sortable-header"
									th:href="@{/employees(keyword=${keyword}, sort='emp_name', order=${currentSort == 'emp_name' and currentOrder == 'asc' ? 'desc' : 'asc'})}">
									社員名 
								</a>
							</th>
							<th>
								<a class="sortable-header"
									th:href="@{/employees(keyword=${keyword}, sort='company_name_assign', order=${currentSort == 'company_name_assign' and currentOrder == 'asc' ? 'desc' : 'asc'})}">
									アサイン先企業 
								</a>
							</th>
							<th>
								<a class="sortable-header"
									th:href="@{/employees(keyword=${keyword}, sort='engineer_type', order=${currentSort == 'engineer_type' and currentOrder == 'asc' ? 'desc' : 'asc'})}">
									エンジニアタイプ 
								</a>
							</th>
							<th>
								<a class="sortable-header"
									th:href="@{/employees(keyword=${keyword}, sort='company_name_belong', order=${currentSort == 'company_name_belong' and currentOrder == 'asc' ? 'desc' : 'asc'})}">
									所属先企業 
								</a>
							</th>
							<th>
								<a class="sortable-header"
									th:href="@{/employees(keyword=${keyword}, sort='', order=${currentSort == '' and currentOrder == 'asc' ? 'desc' : 'asc'})}">
									操作 
								</a>
							</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="emp : ${employees}" class="clickable-row">
							<td class="col-checkbox"><input type="checkbox" name="ids" th:value="${emp.empId}"
									class="row-checkbox"></td>
							<td th:text="${emp.empId}"></td>
							<td th:text="${emp.lastName} + ' ' + ${emp.firstName}"></td>
							<td th:text="${emp.companyNameAssign}"></td>
							<td th:text="${emp.engineerType}"></td>
							<td th:text="${emp.companyName ?: 'ー'}"></td>
							<td class="col-action">
								<a th:href="@{/employees/{id}/detail(id=${emp.empId})}" class="btn-icon-svg" title="詳細">
									<span>ℹ️</span>		
								</a>
								<a th:href="@{/employees/{id}/edit(id=${emp.empId})}" class="btn-icon-svg" title="編集">
								    <span>📝</span>		
							    </a>
								<button type="submit" th:formaction="@{/employees/{id}/delete(id=${emp.empId})}" class="btn-icon-svg delete" title="削除" onclick="return confirm('本当に削除しますか？');">
								    <span>🗑️</span>			
								</button>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(employees)}">
							<td colspan="6" class="text-center">該当するデータがありません。</td>
						</tr>
					</tbody>
				</table>
			</div>
		</form>
	</div>
</body>

</html>
