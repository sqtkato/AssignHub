<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>社員情報一覧</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>社員情報管理</h2>
		</div>

		<div class="card">
			<form th:action="@{/employees}" method="get" class="search-form">
				<div class="form-group form-group-search">
					<label>キーワード検索（社員名）</label>
					<input type="text" name="keyword" class="form-control" th:value="${keyword}" placeholder="例：山田 太郎">
				</div>
				<button type="submit" class="btn btn-secondary">検索</button>
			</form>
		</div>

		<form th:action="@{/employees/bulk-delete}" method="post" id="listForm">
			<div class="table-toolbar">
				<a th:href="@{/employees/new}" class="toolbar-btn toolbar-btn-primary" title="新しい社員を登録">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-linecap="round" stroke-linejoin="round">
						<line x1="12" y1="5" x2="12" y2="19"></line>
						<line x1="5" y1="12" x2="19" y2="12"></line>
					</svg>
					新規登録
				</a>
			</div>

			<div class="card">
				<table class="table">
					<thead class="table-dark">
						<tr>
							<th class="col-checkbox"><input type="checkbox" id="selectAll"></th>
							<th>
								<a class="sortable-header"
									th:href="@{/employees(keyword=${keyword}, sort='emp_id', order=${currentSort == 'emp_id' and currentOrder == 'asc' ? 'desc' : 'asc'})}">
									ID <span class="sort-icon" th:classappend="${currentSort == 'emp_id'} ? 'active'"
										th:text="${currentSort == 'emp_id' and currentOrder == 'desc' ? '▼' : '▲'}"></span>
								</a>
							</th>
							<th>
								<a class="sortable-header"
									th:href="@{/employees(keyword=${keyword}, sort='emp_name', order=${currentSort == 'emp_name' and currentOrder == 'asc' ? 'desc' : 'asc'})}">
									社員名 <span class="sort-icon" th:classappend="${currentSort == 'emp_name'} ? 'active'"
										th:text="${currentSort == 'emp_name' and currentOrder == 'desc' ? '▼' : '▲'}"></span>
								</a>
							</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="emp : ${employees}" class="clickable-row">
							<td class="col-checkbox"><input type="checkbox" name="ids" th:value="${emp.empId}"
									class="row-checkbox"></td>
							<td th:text="${emp.empId}"></td>
							<td th:text="${emp.lastName + ' ' + emp.firstName}"></td>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(employees)}">
							<td colspan="6" class="text-center">該当するデータがありません。</td>
						</tr>
					</tbody>
				</table>
			</div>
		</form>
	</div>
</body>

</html>
