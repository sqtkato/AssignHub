<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>企業情報編集</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>企業情報編集</h2>
		</div>
		<div class="card form-card">
			<form th:action="@{/company/{id}/edit(id=${com.companyId})}" th:object="${companyForm}"
				method="post">

				<div class="form-group">
					<label>企業名 <span class="badge-required">必須</span></label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>企業名カナ</label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>設立年度</label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>社員数</label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>郵便番号 <span class="badge-required">必須</span></label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>住所１</label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>住所２</label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>TEL <span class="badge-required">必須</span></label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>FAX <span class="badge-required">必須</span></label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>代表者姓</label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>

				<div class="form-group">
					<label>代表者名</label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>代表者姓カナ</label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>代表者名カナ</label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('comapnyName')} ? 'input-error'" placeholder="">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>

			</form>
		</div>
	</div>
</body>

</html>
