<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>企業情報登録</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="page-title-area">
			<h2>企業情報登録</h2>
		</div>
		<div class="card form-card">
			<form th:action="@{/companies}" th:object="${companyForm}" method="post">

				<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
					<p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
				</div>

				<div class="form-group">
					<label>企業名 <span class="badge-required">必須</span></label>
					<input type="text" th:field="*{companyName}" class="form-control"
						th:classappend="${#fields.hasErrors('companyName')} ? 'input-error'"
						placeholder="例：株式会社テクノソリューション">
					<div class="error-message" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}">
					</div>
				</div>
				<div class="form-group">
					<label>企業名カナ <span class="badge-required">必須</span></label>
					<input type="text" th:field="*{compNameKana}" class="form-control"
						th:classappend="${#fields.hasErrors('compNameKana')} ? 'input-error'"
						placeholder="例：カブシキガイシャシステム">
					<div class="error-message" th:if="${#fields.hasErrors('compNameKana')}" th:errors="*{compNameKana}">
					</div>
				</div>
				<div class="form-group">
					<label>設立年度 </label>
					<input type="text" th:field="*{foundedYear}" class="form-control"
						th:classappend="${#fields.hasErrors('foundedYear')} ? 'input-error'"
						placeholder="例：2026">
					<div class="error-message" th:if="${#fields.hasErrors('foundedYear')}" th:errors="*{foundedYear}">
					</div>
				</div>
				<div class="form-group">
					<label>社員数 </label>
					<input type="text" th:field="*{employeeCount}" class="form-control"
						th:classappend="${#fields.hasErrors('employeeCount')} ? 'input-error'"
						placeholder="例：100">
					<div class="error-message" th:if="${#fields.hasErrors('employeeCount')}" th:errors="*{employeeCount}">
					</div>
				</div>
				<div class="form-group">
					<label>郵便番号<span class="badge-required">必須</span></label>
					<input type="text" th:field="*{compZipCode}" class="form-control"
						th:classappend="${#fields.hasErrors('compZipCode')} ? 'input-error'"
						placeholder="例：1020073">
					<div class="error-message" th:if="${#fields.hasErrors('compZipCode')}" th:errors="*{compZipCode}">
					</div>
				</div>
				<div class="form-group">
					<label>住所1(自動入力されます) <span class="badge-required">必須</span></label>
					<input type="text" th:field="*{compAddress1}" class="form-control"
						th:classappend="${#fields.hasErrors('compAddress1')} ? 'input-error'"
						placeholder="例：東京都千代田区九段北">
					<div class="error-message" th:if="${#fields.hasErrors('compAddress1')}" th:errors="*{compAddress1}">
					</div>
				</div>
				<div class="form-group">
					<label>住所2 </label>
					<input type="text" th:field="*{compAddress2}" class="form-control"
						th:classappend="${#fields.hasErrors('compAddress2')} ? 'input-error'"
						placeholder="例：1-1-1-1システムビル2F">
					<div class="error-message" th:if="${#fields.hasErrors('compAddress2')}" th:errors="*{compAddress2}">
					</div>
				</div>
				<div class="form-group">
					<label>TEL <span class="badge-required">必須</span></label>
					<input type="text" th:field="*{compTel}" class="form-control"
						th:classappend="${#fields.hasErrors('compTel')} ? 'input-error'"
						placeholder="例：00-0000-0000">
					<div class="error-message" th:if="${#fields.hasErrors('compTel')}" th:errors="*{compTel}">
					</div>
				</div>
				<div class="form-group">
					<label>FAX </label>
					<input type="text" th:field="*{fax}" class="form-control"
						th:classappend="${#fields.hasErrors('fax')} ? 'input-error'"
						placeholder="例：00-0000-0000">
					<div class="error-message" th:if="${#fields.hasErrors('fax')}" th:errors="*{fax}">
					</div>
				</div>
				<div class="form-group">
					<label>代表者姓</label>
					<input type="text" th:field="*{repLastName}" class="form-control"
						th:classappend="${#fields.hasErrors('repLastName')} ? 'input-error'"
						placeholder="例：鈴木">
					<div class="error-message" th:if="${#fields.hasErrors('repLastName')}" th:errors="*{repLastName}">
					</div>
				</div>
				<div class="form-group">
					<label>代表者名</label>
					<input type="text" th:field="*{repFirstName}" class="form-control"
						th:classappend="${#fields.hasErrors('repFirstName')} ? 'input-error'"
						placeholder="例：太郎">
					<div class="error-message" th:if="${#fields.hasErrors('repFirstName')}" th:errors="*{repFirstName}">
					</div>
				</div>
				<div class="form-group">
					<label>代表者姓</label>
					<input type="text" th:field="*{repLastNameKana}" class="form-control"
						th:classappend="${#fields.hasErrors('repLastNameKana')} ? 'input-error'"
						placeholder="例：スズキ">
					<div class="error-message" th:if="${#fields.hasErrors('repLastNameKana')}" th:errors="*{repLastNameKana}">
					</div>
				</div>
				<div class="form-group">
					<label>代表者名</label>
					<input type="text" th:field="*{repFirstNameKana}" class="form-control"
						th:classappend="${#fields.hasErrors('repFirstNameKana')} ? 'input-error'"
						placeholder="例：タロウ">
					<div class="error-message" th:if="${#fields.hasErrors('repFirstNameKana')}" th:errors="*{repFirstNameKana}">
					</div>
				</div>
				<div class="form-actions" style="display: flex; justify-content: flex-end; gap: 8px;">
					<button type="submit" class="btn btn-primary">登録</button>
					<a th:href="@{/companies}" class="btn btn-secondary">戻る</a>
				</div>
			</form>
		</div>
	</div>
</body>

</html>
