!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title layout:title-pattern="$CONTENT_TITLE - AssignHub">AssignHub</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<script th:src="@{/js/common.js}" defer></script>
</head>

<body>
	<!-- =========================
     サイドバー
========================= -->
	<div class="sidebar">
		<h1>AssignHub</h1>

		<ul>
			<li><a th:href="@{/employees}">社員情報</a></li>
			<li th:if="${session.permission == 1}"><a th:href="@{/companies}">企業情報</a></li>
			<li th:if="${session.permission == 1}"><a th:href="@{/accounts}">アカウント情報</a></li>
			<li th:if="${session.permission == 1}"><a th:href="@{/assignments}">アサイン履歴情報</a></li>
			<li>
				<span class="menu-title" th:if="${session.permission == 1}">削除・復元一覧</span>
				<ul class="submenu" th:if="${session.permission == 1}"s>
					<li><a th:href="@{/deleted/employees}">社員情報</a></li>
					<li><a th:href="@{/deleted/companies}">企業情報</a></li>
					<li><a th:href="@{/deleted/accounts}">アカウント情報</a></li>
					<li><a th:href="@{/deleted/assignments}">アサイン履歴情報</a></li>
				</ul>
			</li>
		</ul>

		<!-- サイドバー フッター -->
		<div class="sidebar-footer">
			<span th:text="${session.loginId}"></span>
			<button type="button" class="btn-logout toolbar-btn" onclick="openLogoutModal()"> ログアウト</button>
		</div>
	</div>
	<!-- =========================
     メイン
========================= -->
	<div class="main-content">
		<div class="content-wrapper" layout:fragment="content"></div>
	</div>

	<!-- =========================
     トースト
========================= -->
	<div id="toastMessage" class="toast" th:if="${toastMessage != null or toastError != null}"
		th:classappend="${toastError != null} ? 'toast-error' : ''">
		<span th:text="${toastMessage != null ? toastMessage : toastError}"></span>
	</div>

	<!-- =========================
     ログアウトモーダル
========================= -->
	<div id="logoutOverlay" class="modal-overlay" onclick="closeLogoutModal()">
		<div class="modal-box" onclick="event.stopPropagation()">
			<div class="modal-icon modal-icon-danger">
				<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
					stroke="#dc3545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
					<polyline points="16 17 21 12 16 7"></polyline>
					<line x1="21" y1="12" x2="9" y2="12"></line>
				</svg>
			</div>
			<p class="modal-title">ログアウトしますか？</p>
			<p class="modal-subtitle">ログアウトするとトップページに戻ります。</p>
			<div class="modal-actions">
				<form th:action="@{/logout}" method="post">
					<button type="submit" class="modal-btn modal-btn-danger">ログアウト</button>
					<button type="button" class="modal-btn modal-btn-cancel" onclick="closeLogoutModal()">キャンセル</button>
				</form>
			</div>
		</div>
	</div>

	<!-- =========================
     削除モーダル
========================= -->
	<div id="deleteOverlay" class="modal-overlay" onclick="closeDeleteModal()">
		<div class="modal-box" onclick="event.stopPropagation()">
			<div class="modal-icon modal-icon-danger">
				<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
					stroke="#dc3545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="3 6 5 6 21 6"></polyline>
					<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
				</svg>
			</div>
			<p class="modal-title">削除しますか？</p>
			<p class="modal-subtitle">この操作は取り消せません。</p>
			<div class="modal-actions">
				<form id="deleteForm" method="post">
					<button type="submit" class="modal-btn modal-btn-danger">削除する</button>
					<button type="button" class="modal-btn modal-btn-cancel" onclick="closeDeleteModal()">キャンセル</button>
				</form>
			</div>
		</div>
	</div>

	<!-- =========================
     一括削除モーダル
========================= -->
	<div id="bulkDeleteOverlay" class="modal-overlay" onclick="closeBulkDeleteModal()">
		<div class="modal-box" onclick="event.stopPropagation()">
			<div class="modal-icon modal-icon-danger">
				<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
					stroke="#dc3545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="3 6 5 6 21 6"></polyline>
					<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
				</svg>
			</div>
			<p class="modal-title">選択した内容を削除しますか？</p>
			<p class="modal-subtitle">この操作は取り消せません。</p>
			<div class="modal-actions">
				<button type="button" class="modal-btn modal-btn-danger" onclick="submitBulkDelete()">削除する</button>
				<button type="button" class="modal-btn modal-btn-cancel" onclick="closeBulkDeleteModal()">キャンセル</button>
			</div>
		</div>
	</div>
	
	<!-- =========================
		     復元モーダル
		========================= -->
		
		<div id="restoreOverlay" class="modal-overlay" onclick="closeRestoreModal()">
			<div class="modal-box" onclick="event.stopPropagation()">
				<div class="modal-icon modal-icon-success">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-linecap="round" stroke-linejoin="round">
							<path
								d="M7 16c2.21 0 4-1.79 5-3s2.79-3 5-3a4 4 0 1 1 0 8c-2.21 0-4-1.79-5-3s-2.79-3-5-3a4 4 0 0 0-3.4 1.9" />
							<polyline points="5.5 10 2 12.5 4.5 16" />
						</svg>
				</div>

				<p class="modal-title">復元しますか？</p>
				<p class="modal-subtitle">削除済みデータを復元します。</p>

				<div class="modal-actions">
					<form id="restoreForm" method="post">
						<button type="submit" class="modal-btn modal-btn-success">
							復元する
						</button>
						<button type="button" class="modal-btn modal-btn-cancel"
							onclick="closeRestoreModal()">
							キャンセル
						</button>
					</form>
				</div>
			</div>
		</div>
		<!-- =========================
		     一括復元モーダル
		========================= -->
		<div id="bulkRestoreOverlay" class="modal-overlay" onclick="closeBulkRestoreModal()">
			<div class="modal-box" onclick="event.stopPropagation()">
				<div class="modal-icon modal-icon-success">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-linecap="round" stroke-linejoin="round">
							<path
								d="M7 16c2.21 0 4-1.79 5-3s2.79-3 5-3a4 4 0 1 1 0 8c-2.21 0-4-1.79-5-3s-2.79-3-5-3a4 4 0 0 0-3.4 1.9" />
							<polyline points="5.5 10 2 12.5 4.5 16" />
						</svg>
				</div>

				<p class="modal-title">選択した内容を復元しますか？</p>
				<p class="modal-subtitle">削除済みデータを復元します。</p>

				<div class="modal-actions">
					<button type="button" class="modal-btn modal-btn-success"
						onclick="submitBulkRestore()">復元する</button>

					<button type="button" class="modal-btn modal-btn-cancel"
						onclick="closeBulkRestoreModal()">キャンセル</button>
				</div>
			</div>
		</div>
</body>

</html>
