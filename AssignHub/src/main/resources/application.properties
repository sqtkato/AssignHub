# ===============================
# サーバー設定
# ===============================
server.port=8080

# ===============================
# データベース接続設定 (MySQL / MariaDB)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:13306/assignhub?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=mysql

# MySQLを使用する場合のドライバ
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# MyBatis 設定
# ===============================
# MapperのXMLファイルが配置されている場所を指定する
mybatis.mapper-locations=classpath:mapper/**/*.xml

# DBのカラム名(snake_case)と、Entityのフィールド名(camelCase)を自動マッピングする
mybatis.configuration.map-underscore-to-camel-case=true

# XML側で paramType や resultType を書く際、パッケージ名を省略するための設定
mybatis.type-aliases-package=com.assignhub.entity

# ===============================
# ログ出力設定
# ===============================
# 実行されたSQLとパラメータをEclipseのコンソールに出力する
logging.level.com.assignhub.mapper=DEBUG
# ログファイルの出力先とファイル名を設定
logging.file.name=logs/assignhub-application.log
# ログファイルに出力するログレベル（ERROR, WARN, INFO, DEBUGなど）
logging.level.root=INFO
